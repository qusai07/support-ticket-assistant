[project]
name = "support-ticket-assistant"
version = "0.1.0"
description = "Support ticket resolution assistant: deterministic workflow + local LLM agent with tools"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlmodel>=0.0.22",
    "ollama>=0.4",
    "langgraph>=0.2",
    "chromadb>=0.5",
    "streamlit>=1.38",
    "httpx>=0.27",
    "pandas>=2.2",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evals*", "data*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
